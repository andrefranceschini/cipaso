name: Deploy cipaso.com

# O site é um SPA compilado com Vite: o deploy nativo por Git da Hostinger apenas
# copia o repositório e não roda o build. Por isso o build acontece aqui e só o
# conteúdo de dist/ é publicado, por FTP.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sincronizar_acervo:
        description: 'Enviar também public/uploads (use ao adicionar arquivos ao acervo)'
        type: boolean
        default: false
      remover_pasta_legada:
        description: 'Apagar a pasta public_html/ criada por engano na raiz do site'
        type: boolean
        default: false

# Um deploy por vez: evita dois envios disputando os mesmos arquivos.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e publicação
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verificar artefatos
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "dist/index.html não gerado"; exit 1; }
          test -f dist/.htaccess || { echo ".htaccess ausente no build (rotas do SPA quebrariam)"; exit 1; }
          echo "Tamanho do site (sem uploads): $(du -sh --exclude=uploads dist | cut -f1)"

      # O acervo (67 MB) já está no servidor e é enviado só sob demanda,
      # para o deploy do dia a dia transferir apenas ~1 MB.
      - name: Publicar site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASS }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          protocol: ${{ vars.HOSTINGER_FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          # A conta de FTP já entra na raiz do site: publicar em "public_html/"
          # criaria uma pasta duplicada dentro do domínio.
          server-dir: ${{ vars.HOSTINGER_FTP_PATH || './' }}
          state-name: .deploy-site-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            uploads/**

      - name: Publicar acervo (uploads)
        if: github.event_name == 'workflow_dispatch' && inputs.sincronizar_acervo
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASS }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          protocol: ${{ vars.HOSTINGER_FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/uploads/
          # A conta de FTP já entra na raiz do site: publicar em "public_html/"
          # criaria uma pasta duplicada dentro do domínio.
          server-dir: ${{ vars.HOSTINGER_FTP_PATH || './' }}uploads/
          state-name: .deploy-uploads-state.json
          dangerous-clean-slate: false

      # Limpeza pontual: o primeiro deploy por FTP publicou dentro de public_html/,
      # que na conta de FTP já é a raiz do site. A pasta duplicada ficava acessível
      # em cipaso.com/public_html e geraria conteúdo repetido para buscadores.
      - name: Remover pasta duplicada
        if: github.event_name == 'workflow_dispatch' && inputs.remover_pasta_legada
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_USER }}
          FTP_PASS: ${{ secrets.HOSTINGER_PASS }}
          FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          mkdir -p vazio

          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set cmd:fail-exit yes;
            set net:max-retries 2;
            open -u '$FTP_USER','$FTP_PASS' -p $FTP_PORT ftp://$FTP_HOST;
            cls -1;
            mirror --reverse --delete --verbose=1 vazio public_html;
            rmdir public_html;
            cls -1;
            bye
          "
          echo 'Pasta public_html/ removida da raiz do site.'

      - name: Verificar site no ar
        run: |
          set -euo pipefail
          for tentativa in 1 2 3; do
            status=$(curl -fsS -o /dev/null -w '%{http_code}' https://cipaso.com/ || echo '000')
            echo "Tentativa $tentativa: HTTP $status"
            [ "$status" = '200' ] && exit 0
            sleep 15
          done
          echo 'O site não respondeu 200 após o deploy.'
          exit 1
