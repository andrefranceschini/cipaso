    <title>Memorial CIPASO — Centro de Investigação Parapsicológica de Sorocaba</title>

    <meta name="author" content="Memorial CIPASO" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <meta property="og:type" content="website" />

      property="og:description"
      content="Acervo digital, artigos e memória do CIPASO e do Prof. Valter Franceschini."
    />
    <meta property="og:url" content="https://cipaso.com/" />
    <meta property="og:image" content="https://cipaso.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Centro de Investigação Parapsicológica de Sorocaba",
        "alternateName": "CIPASO",
        "url": "https://cipaso.com",
        "logo": "https://cipaso.com/og-image.png",
        "foundingDate": "1989",
        "dissolutionDate": "2016",
        "email": "contato@cipaso.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua Oswaldo Segamarchi, 15",
          "addressLocality": "Sorocaba",
          "addressRegion": "SP",
          "addressCountry": "BR"
        },
        "founder": {
          "@type": "Person",
          "name": "Valter Álfredo Franceschini",
          "birthDate": "1940-08-02",
          "deathDate": "2016-02-18"
        }
      }
    </script>

    <style>
      /* Fundo pintado antes de qualquer CSS carregar: sem flash claro */
      html {
        background: #06090d;
      }
      html.light {
        background: #eef3f4;
      }
    </style>
    <script>
      // O escuro é o padrão; aplica o claro antes da primeira pintura se salvo.
      ;(function () {
        try {
          if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#eef3f4')
          }
        } catch (error) {
          /* armazenamento bloqueado: mantém o escuro */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto">
        <h1>Memorial CIPASO</h1>
        <p>
          Este memorial digital precisa de JavaScript para exibir o acervo. Ative o JavaScript ou acesse
          diretamente as publicações em
          <a href="/sitemap-pdfs.xml">/sitemap-pdfs.xml</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
